server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 8M;
    etag on;

    # Negotiate build-time .gz sidecars; plain files remain available.
    gzip_static on;
    gzip_vary on;

    # Only content-hashed files receive long-lived cache headers.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # HTML discovers new asset hashes on every revalidation.
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }

    # Preserve the original backend endpoints and behavior.
    location ~ ^/(api(?:/|$)|signin/?$|signup/?$|signout/?$) {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_redirect off;
    }
}
