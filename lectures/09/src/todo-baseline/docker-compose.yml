services:
  certificates:
    build: ../todo-shared/tls
    volumes:
      - ./certs:/certs

  nginx-proxy:
    image: jwilder/nginx-proxy
    depends_on:
      certificates:
        condition: service_completed_successfully
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - ./certs:/etc/nginx/certs:ro

  frontend:
    depends_on:
      - backend
    image: nginx:1.29-alpine-slim
    restart: unless-stopped
    volumes:
      - ../todo-shared/frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    environment:
      - VIRTUAL_HOST=localhost

  backend:
    build: ../todo-shared/backend
    restart: unless-stopped
    volumes:
      - ./db:/home/app/db
      - ./uploads:/home/app/uploads
